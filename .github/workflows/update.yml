name: Update Champions League data

on:
  schedule:
    - cron: "0 */6 * * *"
    - cron: "0 18-23 * * 2-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch matches
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python fetch_data.py

      - name: Commit if changed
        run: |
          git config user.name "ucl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
